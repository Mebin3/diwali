
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Magical Diwali Surprise</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<canvas id="fireworks"></canvas>
<div class="particles"></div>

<div class="main">

    <div class="top-text">✨ A SPECIAL SURPRISE FOR YOU ✨</div>

    <h1 class="heading">Festival of Lights</h1>

    <p class="subtitle">Something Magical Is Waiting For You...</p>

    <div class="light-circle"></div>

    <div class="gift-area" id="gift">

        <div class="gift-glow"></div>

        <div class="gift-box">

            <div class="box-front"></div>

            <div class="box-ribbon"></div>

            <div class="box-lid" id="lid">
                <div class="lid-ribbon"></div>
                <div class="bow">🎀</div>
            </div>

        </div>

        <div class="gift-sparkle">✨</div>

    </div>

    <p class="instruction" id="instruction">
        A little happiness is waiting inside!
    </p>

    <button id="openBtn">🎁 OPEN THE GIFT</button>

    <div id="countdown"></div>

    <div id="celebration">

        <div class="big-stars">✨ ⭐ ✨</div>

        <h2 id="happyTitle">HAPPY DIWALI!</h2>

        <div class="diyas">🪔 🪔 🪔</div>

        <div id="wish"></div>

        <div class="final-message">
            May your world always shine brighter! ❤️
        </div>

        <div class="celebration-icons">
            🎆 🎇 🪔 🎆 🎇
        </div>

    </div>

    <div class="share">

        <p>SHARE THE HAPPINESS ❤️</p>

        <button onclick="share('whatsapp')">WhatsApp</button>

        <button onclick="share('facebook')">Facebook</button>

        <button onclick="share('instagram')">Instagram</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
